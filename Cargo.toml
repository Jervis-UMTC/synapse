[workspace]
members = [
    "crates/synapse-cli",
    "crates/synapse-core",
    "crates/synapse-ipc",
    "crates/synapse-store",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
repository = "https://github.com/Jervis-UMTC/synapse"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"
